   <g id="text_1">
    <text style="font-weight: 700; font-size: 9.5px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #0b0b0b" x="26.73" y="42.360276" transform="rotate(-0 26.73 42.360276)">1  Candidate loading axes</text>
   </g>
   <g id="text_2">
    <text style="font-size: 7.6px; font-family: 'DejaVu Sans'; fill: #0b0b0b" transform="translate(26.73 64.387651)">unit Mandel directions</text>
    <text style="font-size: 7.6px; font-family: 'DejaVu Sans'; fill: #0b0b0b" transform="translate(26.73 74.290035)">d = (σxx, σyy, √2σxy)/‖·‖</text>
    <text style="font-size: 7.6px; font-family: 'DejaVu Sans'; fill: #0b0b0b" transform="translate(26.73 83.87797)">antipodal axes {d, −d}</text>
    <text style="font-size: 7.6px; font-family: 'DejaVu Sans'; fill: #0b0b0b" transform="translate(26.73 93.254529)">(B1/B2: 207-axis library;</text>
    <text style="font-size: 7.6px; font-family: 'DejaVu Sans'; fill: #0b0b0b" transform="translate(26.73 102.631088)">analytic: 4,096 equal-area;</text>
    <text style="font-size: 7.6px; font-family: 'DejaVu Sans'; fill: #0b0b0b" transform="translate(26.73 112.007648)">TL1: 8,192 signed directions)</text>
   </g>
   <g id="text_3">
    <text style="font-weight: 700; font-size: 9.5px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #0b0b0b" x="210.87" y="42.360276" transform="rotate(-0 210.87 42.360276)">2  Initial design</text>
   </g>
   <g id="text_4">
    <text style="font-size: 7.6px; font-family: 'DejaVu Sans'; fill: #0b0b0b" transform="translate(210.87 64.387651)">8 axial-maximin axes from a</text>
    <text style="font-size: 7.6px; font-family: 'DejaVu Sans'; fill: #0b0b0b" transform="translate(210.87 73.76421)">seeded first axis; shared by</text>
    <text style="font-size: 7.6px; font-family: 'DejaVu Sans'; fill: #0b0b0b" transform="translate(210.87 83.14077)">every method (BO, V3,</text>
    <text style="font-size: 7.6px; font-family: 'DejaVu Sans'; fill: #0b0b0b" transform="translate(210.87 92.517329)">maximin, random)</text>
   </g>
   <g id="text_5">
    <text style="font-weight: 700; font-size: 9.5px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #0b0b0b" x="383.85" y="42.360276" transform="rotate(-0 383.85 42.360276)">3  MOOSE virtual test</text>
   </g>
   <g id="text_6">
    <text style="font-size: 7.6px; font-family: 'DejaVu Sans'; fill: #0b0b0b" transform="translate(383.85 64.387651)">periodic RVE / truss under</text>
    <text style="font-size: 7.6px; font-family: 'DejaVu Sans'; fill: #0b0b0b" transform="translate(383.85 73.76421)">stress control along d;</text>
    <text style="font-size: 7.6px; font-family: 'DejaVu Sans'; fill: #0b0b0b" transform="translate(383.85 83.14077)">load ramp + refinement until</text>
    <text style="font-size: 7.6px; font-family: 'DejaVu Sans'; fill: #0b0b0b" transform="translate(383.85 92.517329)">volume-avg plastic strain = 1e-4</text>
    <text style="font-size: 7.6px; font-family: 'DejaVu Sans'; fill: #0b0b0b" transform="translate(383.85 101.893888)">→ yield radius r(d)  (~2–3 min,</text>
    <text style="font-size: 7.6px; font-family: 'DejaVu Sans'; fill: #0b0b0b" transform="translate(383.85 111.270448)">B1/B2; 7 s, TL1)</text>
   </g>
   <g id="text_7">
    <text style="font-weight: 700; font-size: 9.5px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #0b0b0b" x="584.73" y="42.286057" transform="rotate(-0 584.73 42.286057)">4  GP surrogate</text>
   </g>
   <g id="text_8">
    <text style="font-size: 7.6px; font-family: 'DejaVu Sans'; fill: #0b0b0b" transform="translate(584.73 64.691651)">Matérn-3/2 GP on log r,</text>
    <text style="font-size: 7.6px; font-family: 'DejaVu Sans'; fill: #0b0b0b" transform="translate(584.73 74.06821)">antipodal pseudo-obs.,</text>
    <text style="font-size: 7.6px; font-family: 'DejaVu Sans'; fill: #0b0b0b" transform="translate(584.73 83.44477)">A20: ℓ = 0.5 fixed (n &lt; 20),</text>
    <text style="font-size: 7.6px; font-family: 'DejaVu Sans'; fill: #0b0b0b" transform="translate(584.73 92.821329)">ML-II (n ≥ 20)</text>
   </g>
   <g id="text_9">
    <text style="font-weight: 700; font-size: 9.5px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #0b0b0b" x="584.73" y="215.599188" transform="rotate(-0 584.73 215.599188)">5  Acquisition</text>
   </g>
   <g id="text_10">
    <text style="font-size: 7.6px; font-family: 'DejaVu Sans'; fill: #0b0b0b" transform="translate(584.73 237.626563)">V2 (MES): max σ²ₙ(d)</text>
    <text style="font-size: 7.6px; font-family: 'DejaVu Sans'; fill: #0b0b0b" transform="translate(584.73 247.003122)">V3 (LRV): max σ²ₙ(d)·ρₙ(d)</text>
    <text style="font-size: 7.6px; font-family: 'DejaVu Sans'; fill: #0b0b0b" transform="translate(584.73 256.379682)">ρₙ: interpolated LOO</text>
    <text style="font-size: 7.6px; font-family: 'DejaVu Sans'; fill: #0b0b0b" transform="translate(584.73 265.756241)">residuals</text>
    <text style="font-size: 7.6px; font-family: 'DejaVu Sans'; fill: #0b0b0b" transform="translate(584.73 275.1328)">next untested axis</text>
   </g>
   <g id="text_11">
    <text style="font-weight: 700; font-size: 9.5px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #0b0b0b" x="383.85" y="215.599188" transform="rotate(-0 383.85 215.599188)">6  Budget reached?</text>
   </g>
   <g id="text_12">
    <text style="font-size: 7.6px; font-family: 'DejaVu Sans'; fill: #0b0b0b" transform="translate(383.85 237.626563)">n = 33 (B1/B2)</text>
    <text style="font-size: 7.6px; font-family: 'DejaVu Sans'; fill: #0b0b0b" transform="translate(383.85 247.003122)">n = 64 (TL1; checkpoint 33)</text>
    <text style="font-size: 7.6px; font-family: 'DejaVu Sans'; fill: #0b0b0b" transform="translate(383.85 256.379682)">n = 33 / 64 (analytic)</text>
    <text style="font-size: 7.6px; font-family: 'DejaVu Sans'; fill: #0b0b0b" transform="translate(383.85 265.756241)">failed solves: axis marked</text>
    <text style="font-size: 7.6px; font-family: 'DejaVu Sans'; fill: #0b0b0b" transform="translate(383.85 275.1328)">unavailable, budget kept</text>
   </g>
   <g id="text_13">
    <text style="font-weight: 700; font-size: 9.5px; font-family: 'DejaVu Sans'; fill: #0b0b0b" transform="translate(740.97 42.360276)">7  Independent</text>
    <text style="font-weight: 700; font-size: 9.5px; font-family: 'DejaVu Sans'; fill: #0b0b0b" transform="translate(740.97 52.998197)">references</text>
   </g>
   <g id="text_14">
    <text style="font-size: 7.6px; font-family: 'DejaVu Sans'; fill: #0b0b0b" transform="translate(740.97 64.387651)">MOOSE refs never</text>
    <text style="font-size: 7.6px; font-family: 'DejaVu Sans'; fill: #0b0b0b" transform="translate(740.97 73.76421)">seen by any</text>
    <text style="font-size: 7.6px; font-family: 'DejaVu Sans'; fill: #0b0b0b" transform="translate(740.97 83.14077)">controller</text>
    <text style="font-size: 7.6px; font-family: 'DejaVu Sans'; fill: #0b0b0b" transform="translate(740.97 92.517329)">(B1/B2: 60 + 12;</text>
    <text style="font-size: 7.6px; font-family: 'DejaVu Sans'; fill: #0b0b0b" transform="translate(740.97 101.893888)">TL1: 482)</text>
   </g>
   <g id="text_15">
    <text style="font-weight: 700; font-size: 9.5px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #0b0b0b" x="740.97" y="215.599188" transform="rotate(-0 740.97 215.599188)">8  Evaluation</text>
   </g>
   <g id="text_16">
    <text style="font-size: 7.6px; font-family: 'DejaVu Sans'; fill: #0b0b0b" transform="translate(740.97 237.626563)">refit frozen GP on</text>
    <text style="font-size: 7.6px; font-family: 'DejaVu Sans'; fill: #0b0b0b" transform="translate(740.97 247.003122)">each design's first</text>
    <text style="font-size: 7.6px; font-family: 'DejaVu Sans'; fill: #0b0b0b" transform="translate(740.97 256.790082)">n tests; |r̂/r − 1|,</text>
    <text style="font-size: 7.6px; font-family: 'DejaVu Sans'; fill: #0b0b0b" transform="translate(740.97 266.378016)">coverage, paired</text>
    <text style="font-size: 7.6px; font-family: 'DejaVu Sans'; fill: #0b0b0b" transform="translate(740.97 275.754575)">statistics</text>
   </g>
