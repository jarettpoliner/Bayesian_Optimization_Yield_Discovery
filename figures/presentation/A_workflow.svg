   <g id="text_22">
    <text style="font-size: 8px; font-family: 'DejaVu Sans'; fill: #52514e" transform="translate(18.36 206.076894)">Closed loop (blue/orange) sees only the candidate</text>
    <text style="font-size: 8px; font-family: 'DejaVu Sans'; fill: #52514e" transform="translate(18.36 215.035144)">axes and its own MOOSE results.</text>
    <text style="font-size: 8px; font-family: 'DejaVu Sans'; fill: #52514e" transform="translate(18.36 223.993394)"/>
    <text style="font-size: 8px; font-family: 'DejaVu Sans'; fill: #52514e" transform="translate(18.36 232.951644)">Evaluation (green) uses independent MOOSE</text>
    <text style="font-size: 8px; font-family: 'DejaVu Sans'; fill: #52514e" transform="translate(18.36 241.909894)">references, never visible to a controller.</text>
    <text style="font-size: 8px; font-family: 'DejaVu Sans'; fill: #52514e" transform="translate(18.36 250.868144)"/>
    <text style="font-size: 8px; font-family: 'DejaVu Sans'; fill: #52514e" transform="translate(18.36 259.826394)">Response ablations (V2: smooth base; V3: isotropic</text>
    <text style="font-size: 8px; font-family: 'DejaVu Sans'; fill: #52514e" transform="translate(18.36 268.784644)">J2) feed the same loop uninformative responses to</text>
    <text style="font-size: 8px; font-family: 'DejaVu Sans'; fill: #52514e" transform="translate(18.36 277.742894)">test whether selections — and accuracy — depend</text>
    <text style="font-size: 8px; font-family: 'DejaVu Sans'; fill: #52514e" transform="translate(18.36 286.701144)">on the measured material.</text>
   </g>
